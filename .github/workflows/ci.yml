name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Stack validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose config (production)
        env:
          FREEPBX_IMAGE_TAG: latest
        run: docker compose -f docker-compose.yml config --quiet

      - name: Docker Compose config (development)
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Shell scripts syntax
        run: |
          set -euo pipefail
          for script in docker/*.sh scripts/*.sh e2e/run.sh install.sh; do
            bash -n "$script"
          done

      - name: Required files present
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f docker-compose.yml
          test -f docker-compose.dev.yml
          test -f .env.example
          test -f asterisk/extensions_custom.conf
          test -f e2e/run.sh
          test -f e2e/MATRIX.md
          test -f .github/workflows/publish-image.yml

  e2e-smoke:
    name: E2E smoke (offline)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: E2E runner exits cleanly without live stack
        env:
          E2E_CONNECTOR_URL: ""
          E2E_APP_URL: ""
          FREEPBX_IMAGE_TAG: latest
        run: |
          set +e
          ./e2e/run.sh
          code=$?
          set -e
          test "$code" -eq 0
