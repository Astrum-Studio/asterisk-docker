# Production: pull prebuilt FreePBX image from GHCR (no local build).
# Usage:
#   export FREEPBX_IMAGE_TAG=latest   # or pin v1.2.3 / sha-…
#   docker compose pull && docker compose up -d
#
# Dev (local build): docker compose -f docker-compose.dev.yml up -d --build

x-freepbx-image: &freepbx-image
  image: ghcr.io/astrum-studio/asterisk-docker:${FREEPBX_IMAGE_TAG:?Set FREEPBX_IMAGE_TAG to a pinned tag}
  container_name: freepbx
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    db:
      condition: service_healthy
  network_mode: "host"
  environment:
    TZ: "${TZ:-Europe/Moscow}"
    HTTP_PORT: "${HTTP_PORT:-8080}"
    FREEPBX_DB_HOST: "127.0.0.1"
    FREEPBX_DB_NAME: "${FREEPBX_DB_NAME:-asterisk}"
    FREEPBX_CDR_DB_NAME: "${FREEPBX_CDR_DB_NAME:-asteriskcdrdb}"
    FREEPBX_DB_USER: "${FREEPBX_DB_USER:-freepbx}"
    FREEPBX_DB_PASS: "${FREEPBX_DB_PASS:-freepbx}"
    FREEPBX_DB_PORT: "${FREEPBX_DB_PORT:-3307}"
    RTP_START: "${RTP_START:-10000}"
    RTP_FINISH: "${RTP_FINISH:-20000}"
  volumes:
    - ./data:/data
    - ./www:/var/www/html
    - ./asterisk:/etc/asterisk
    - ./sounds/custom:/var/lib/asterisk/sounds/custom
    - ./recordings:/var/spool/asterisk/monitor
    - ./voicemail:/var/spool/asterisk/voicemail
    - ./certs:/certs
    - ./logs:/var/log
  shm_size: "256m"

services:
  db:
    image: mariadb:10.11
    container_name: freepbx-db
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-freepbx-root}"
      MYSQL_DATABASE: "${FREEPBX_DB_NAME:-asterisk}"
      MYSQL_USER: "${FREEPBX_DB_USER:-freepbx}"
      MYSQL_PASSWORD: "${FREEPBX_DB_PASS:-freepbx}"
      FREEPBX_CDR_DB_NAME: "${FREEPBX_CDR_DB_NAME:-asteriskcdrdb}"
    ports:
      - "${FREEPBX_DB_BIND:-127.0.0.1}:${FREEPBX_DB_PORT:-3307}:3306"
    volumes:
      - ./mysql:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - ./docker/db/my.cnf:/etc/mysql/conf.d/freepbx.cnf:ro
      - ./docker/db/docker-entrypoint.sh:/usr/local/bin/freepbx-db-entrypoint.sh:ro
      - ./docker/db/ensure-remote-access.sh:/usr/local/bin/ensure-remote-access.sh:ro
    entrypoint: ["/usr/local/bin/freepbx-db-entrypoint.sh"]
    command: ["mariadbd"]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  freepbx:
    <<: *freepbx-image
