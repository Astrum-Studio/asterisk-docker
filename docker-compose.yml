# Production: pull prebuilt FreePBX image from GHCR (no local build).
# Usage:
#   export FREEPBX_IMAGE_TAG=latest   # or pin v1.2.3 / sha-…
#   docker compose pull && docker compose up -d
#
# Dev (local build): docker compose -f docker-compose.dev.yml up -d --build

x-freepbx-image: &freepbx-image
  image: ghcr.io/astrum-studio/asterisk-docker:${FREEPBX_IMAGE_TAG:?Set FREEPBX_IMAGE_TAG to a pinned tag}
  container_name: ${COMPOSE_PROJECT_NAME:-freepbx}
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    db:
      condition: service_healthy
  network_mode: "host"
  environment:
    COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-freepbx}"
    TZ: "${TZ:-Europe/Moscow}"
    HTTP_PORT: "${HTTP_PORT:-8080}"
    FREEPBX_DB_HOST: "127.0.0.1"
    FREEPBX_DB_NAME: "${FREEPBX_DB_NAME:-asterisk}"
    FREEPBX_CDR_DB_NAME: "${FREEPBX_CDR_DB_NAME:-asteriskcdrdb}"
    FREEPBX_DB_USER: "${FREEPBX_DB_USER:-freepbx}"
    FREEPBX_DB_PASS: "${FREEPBX_DB_PASS:-freepbx}"
    FREEPBX_DB_PORT: "${FREEPBX_DB_PORT:-3307}"
    SIP_PORT: "${SIP_PORT:-5060}"
    SIPS_PORT: "${SIPS_PORT:-5061}"
    SIP_LEGACY_PORT: "${SIP_LEGACY_PORT:-5160}"
    RTP_START: "${RTP_START:-10000}"
    RTP_FINISH: "${RTP_FINISH:-20000}"
    ASTERISK_AMI_ENABLED: "${ASTERISK_AMI_ENABLED:-1}"
    ASTERISK_AMI_BINDADDR: "${ASTERISK_AMI_BINDADDR:-0.0.0.0}"
    ASTERISK_AMI_PORT: "${ASTERISK_AMI_PORT:-5038}"
    ASTERISK_AMI_USER: "${ASTERISK_AMI_USER:-admin}"
    ASTERISK_AMI_PASSWORD: "${ASTERISK_AMI_PASSWORD:-change-this-ami-password}"
    ASTERISK_AMI_PERMIT: "${ASTERISK_AMI_PERMIT:-127.0.0.0/255.0.0.0}"
    ASTERISK_AMI_PERMIT_HOST_IPS: "${ASTERISK_AMI_PERMIT_HOST_IPS:-1}"
    ASTERISK_AMI_PERMIT_DOCKER: "${ASTERISK_AMI_PERMIT_DOCKER:-1}"
    ASTERISK_HTTP_PORT: "${ASTERISK_HTTP_PORT:-8088}"
    ASTERISK_HTTPS_PORT: "${ASTERISK_HTTPS_PORT:-8089}"
    ASTERISK_IAX_PORT: "${ASTERISK_IAX_PORT:-4569}"
  volumes:
    - ./data:/data
    - ./www:/var/www/html
    - ./asterisk:/etc/asterisk
    - ./sounds/custom:/var/lib/asterisk/sounds/custom
    - ./recordings:/var/spool/asterisk/monitor
    - ./voicemail:/var/spool/asterisk/voicemail
    - ./certs:/certs
    - ./logs:/var/log
  shm_size: "256m"

services:
  db:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME:-freepbx}-db
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-freepbx-root}"
      MYSQL_DATABASE: "${FREEPBX_DB_NAME:-asterisk}"
      MYSQL_USER: "${FREEPBX_DB_USER:-freepbx}"
      MYSQL_PASSWORD: "${FREEPBX_DB_PASS:-freepbx}"
      FREEPBX_CDR_DB_NAME: "${FREEPBX_CDR_DB_NAME:-asteriskcdrdb}"
    ports:
      # Default 0.0.0.0 so same-host Connector can use host.docker.internal (firewall FREEPBX_DB_PORT).
      - "${FREEPBX_DB_BIND:-0.0.0.0}:${FREEPBX_DB_PORT:-3307}:3306"
    volumes:
      - ./mysql:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - ./docker/db/my.cnf:/etc/mysql/conf.d/freepbx.cnf:ro
      - ./docker/db/docker-entrypoint.sh:/usr/local/bin/freepbx-db-entrypoint.sh:ro
      - ./docker/db/ensure-remote-access.sh:/usr/local/bin/ensure-remote-access.sh:ro
    entrypoint: ["/usr/local/bin/freepbx-db-entrypoint.sh"]
    command: ["mariadbd"]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  freepbx:
    <<: *freepbx-image
