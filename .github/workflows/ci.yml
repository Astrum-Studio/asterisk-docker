name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Stack validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose config (production)
        env:
          FREEPBX_IMAGE_TAG: latest
        run: docker compose -f docker-compose.yml config --quiet

      - name: Docker Compose config (development)
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Shell scripts syntax
        run: |
          set -euo pipefail
          for script in docker/*.sh docker/db/*.sh scripts/*.sh scripts/lib/*.sh install.sh; do
            bash -n "$script"
          done

      - name: Required files present
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f docker-compose.yml
          test -f docker-compose.dev.yml
          test -f .env.example
          test -f install.sh
          test -f scripts/autoinstaller.sh
          test -f .github/workflows/publish-image.yml

      - name: Installer help (offline)
        run: |
          set -euo pipefail
          ./install.sh --help >/dev/null
          ./scripts/autoinstaller.sh --help >/dev/null
